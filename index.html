<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Gộp ô trong bảng</title>
</head>
<body>
    <h2>Thời khóa biểu</h2>

    <table border="1">
        <!-- Hàng tiêu đề -->
        <tr>
            <th>Thứ</th>
            <th>Môn học</th>
            <th>Giáo viên</th>
        </tr>

        <!-- Thứ Hai có 2 môn, dùng rowspan="2" để gộp 2 hàng -->
        <tr>
            <td rowspan="2">Thứ Hai</td>
            <td>Toán</td>
            <td>Thầy Nam</td>
        </tr>
        <tr>
            <td>Văn</td>
            <td>Cô Hạnh</td>
        </tr>

        <!-- Thứ Ba nghỉ học, dùng colspan="2" để gộp 2 cột Môn học & Giáo viên -->
        <tr>
            <td>Thứ Ba</td>
            <td colspan="2">Nghỉ học</td>
        </tr>
    </table>
</body>
</html>
