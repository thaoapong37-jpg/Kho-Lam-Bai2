<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành CSS grid-row</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Thực hành thuộc tính grid-row</h1>

    <!-- Ví dụ 1: Phần tử chiếm từ đường kẻ hàng 1 đến đường kẻ hàng 3 -->
    <section>
        <h2>1. Kéo dài qua 2 hàng (grid-row: 1 / 3)</h2>
        <div class="grid-container">
            <div class="grid-item item-row-span">Phần tử 1 (grid-row: 1 / 3)</div>
            <div class="grid-item">Phần tử 2</div>
            <div class="grid-item">Phần tử 3</div>
            <div class="grid-item">Phần tử 4</div>
            <div class="grid-item">Phần tử 5</div>
        </div>
    </section>

    <!-- Ví dụ 2: Dùng cú pháp span (grid-row: span 2) -->
    <section>
        <h2>2. Sử dụng cú pháp span (grid-row: 2 / span 2)</h2>
        <div class="grid-container">
            <div class="grid-item">Phần tử A</div>
            <div class="grid-item item-span-2">Phần tử B (bắt đầu hàng 2, kéo dài 2 hàng)</div>
            <div class="grid-item">Phần tử C</div>
            <div class="grid-item">Phần tử D</div>
        </div>
    </section>

</body>
</html>
