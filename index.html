<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành CSS flex-grow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Thực hành thuộc tính CSS flex-grow</h1>

    <!-- Ví dụ đề bài: 5 phần tử con, phần tử thứ 2 đặt flex-grow để chiếm phần còn lại -->
    <section>
        <h2>1. Áp dụng flex-grow: 1 cho div thứ 2 (4 div còn lại giữ nguyên)</h2>
        <div class="flex-container">
            <div class="item">1</div>
            <div class="item grow-item">2 (flex-grow: 1)</div>
            <div class="item">3</div>
            <div class="item">4</div>
            <div class="item">5</div>
        </div>
    </section>

    <!-- Ví dụ 2: So sánh tốc độ phát triển giữa các tỷ lệ flex-grow khác nhau -->
    <section>
        <h2>2. So sánh flex-grow: 1, 2 và 3 (chia sẻ khoảng trống theo tỷ lệ)</h2>
        <div class="flex-container">
            <div class="item grow-1">grow: 1</div>
            <div class="item grow-2">grow: 2</div>
            <div class="item grow-3">grow: 3</div>
        </div>
    </section>

    <!-- Ví dụ 3: Giá trị initial (mặc định bằng 0 - không co giãn) -->
    <section>
        <h2>3. flex-grow: initial (mặc định = 0)</h2>
        <div class="flex-container">
            <div class="item grow-initial">initial (0)</div>
            <div class="item grow-initial">initial (0)</div>
            <div class="item grow-initial">initial (0)</div>
        </div>
    </section>

</body>
</html>
