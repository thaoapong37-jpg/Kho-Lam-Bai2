<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành CSS flex-flow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Thực hành thuộc tính CSS flex-flow</h1>

    <!-- 1. flex-flow: row nowrap (Mặc định: xếp theo hàng, không xuống dòng) -->
    <section>
        <h2>1. flex-flow: row nowrap (Hướng hàng ngang, không ngắt dòng)</h2>
        <div class="flex-container flow-row-nowrap">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
            <div class="item">4</div>
            <div class="item">5</div>
        </div>
    </section>

    <!-- 2. flex-flow: row-reverse nowrap (Xếp ngược hướng hàng ngang) -->
    <section>
        <h2>2. flex-flow: row-reverse nowrap (Đảo ngược thứ tự hàng ngang, không ngắt dòng)</h2>
        <div class="flex-container flow-row-reverse-nowrap">
            <div class="item item-green">1</div>
            <div class="item item-green">2</div>
            <div class="item item-green">3</div>
            <div class="item item-green">4</div>
            <div class="item item-green">5</div>
        </div>
    </section>

    <!-- 3. flex-flow: row wrap (Xếp theo hàng ngang và tự động xuống dòng khi tràn) -->
    <section>
        <h2>3. flex-flow: row wrap (Hướng hàng ngang, tự động xuống dòng)</h2>
        <div class="flex-container flow-row-wrap">
            <div class="item item-orange">1</div>
            <div class="item item-orange">2</div>
            <div class="item item-orange">3</div>
            <div class="item item-orange">4</div>
            <div class="item item-orange">5</div>
        </div>
    </section>

</body>
</html>
