<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Tạo liên kết trong HTML</title>
</head>
<body>
    <!-- Tiêu đề chính -->
    <h1>Liên kết yêu thích của tôi</h1>

    <!-- Danh sách liên kết đến các trang web khác nhau -->
    <h2>Trang web yêu thích</h2>
    <ul>
        <li>
            <!-- Liên kết mở tab mới với target="_blank" -->
            <a href="https://www.google.com" target="_blank">Google (Mở trong tab mới)</a>
        </li>
        <li>
            <a href="https://www.youtube.com" target="_blank">YouTube</a>
        </li>
        <li>
            <a href="https://github.com" target="_blank">GitHub</a>
        </li>
    </ul>

    <!-- Liên kết đến file HTML khác trong cùng thư mục -->
    <h2>Liên kết nội bộ</h2>
    <p>
        Xem thông tin chi tiết tại: <a href="about.html">Trang giới thiệu (about.html)</a>
    </p>

    <!-- Liên kết gửi email -->
    <h2>Liên hệ</h2>
    <p>
        Gửi thư cho tôi: <a href="mailto:thaoapong37@gmail.com">thaoapong37@gmail.com</a>
    </p>
</body>
</html>
