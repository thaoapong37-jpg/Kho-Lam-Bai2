<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành CSS grid-template-columns</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Thực hành thuộc tính grid-template-columns</h1>

    <!-- Ví dụ 1: Chia cột theo kích thước cố định và auto -->
    <section>
        <h2>Ví dụ 1: Cố định kết hợp auto (120px auto 120px)</h2>
        <div class="grid-container example-1">
            <div class="grid-item">Cột 1 (120px)</div>
            <div class="grid-item">Cột 2 (auto - chiếm phần còn lại)</div>
            <div class="grid-item">Cột 3 (120px)</div>
            <div class="grid-item">Mục 4</div>
            <div class="grid-item">Mục 5</div>
            <div class="grid-item">Mục 6</div>
        </div>
    </section>

    <!-- Ví dụ 2: Sử dụng tỉ lệ phân số fr và min/max-content -->
    <section>
        <h2>Ví dụ 2: Tỉ lệ linh hoạt (1fr 2fr 1fr)</h2>
        <div class="grid-container example-2">
            <div class="grid-item">Cột 1 (1fr)</div>
            <div class="grid-item">Cột 2 (2fr - gấp đôi)</div>
            <div class="grid-item">Cột 3 (1fr)</div>
            <div class="grid-item">Dữ liệu A</div>
            <div class="grid-item">Dữ liệu B</div>
            <div class="grid-item">Dữ liệu C</div>
        </div>
    </section>

</body>
</html>
