<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành Màu nền và Ảnh nền CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Tiêu đề h1 theo yêu cầu -->
    <h1>Chào mừng đến với trang web của tôi</h1>

    <!-- Đoạn văn mô tả trang web -->
    <p class="intro-text">Đây là trang web giới thiệu các dự án lập trình giao diện web và luyện tập kỹ năng định dạng với CSS background.</p>

    <!-- Khối div chứa nội dung quan trọng có ảnh nền và căn giữa nội dung -->
    <div class="highlight-box">
        <div class="overlay-content">
            <h2>Nội Dung Nổi Bật</h2>
            <p>Khám phá thế giới lập trình web sáng tạo cùng HTML5 &amp; CSS3.</p>
            <button type="button">Tìm hiểu thêm</button>
        </div>
    </div>

</body>
</html>
