<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Danh sách sản phẩm</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        table {
            width: 100%;
            max-width: 600px;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px 12px;
            text-align: left;
        }

        th {
            background-color: #f4f6f9;
            font-weight: bold;
        }

        tr:nth-child(even) {
            background-color: #fbfbfb;
        }
    </style>
</head>
<body>

    <!-- Tiêu đề chính -->
    <h1>Danh sách sản phẩm</h1>

    <!-- Bảng danh sách sản phẩm gồm 3 cột và 4 sản phẩm -->
    <table>
        <thead>
            <tr>
                <th>Tên sản phẩm</th>
                <th>Giá</th>
                <th>Số lượng</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Laptop Dell XPS 13</td>
                <td>25.000.000 VNĐ</td>
                <td>10</td>
            </tr>
            <tr>
                <td>Chuột không dây Logitech</td>
                <td>450.000 VNĐ</td>
                <td>50</td>
            </tr>
            <tr>
                <td>Bàn phím cơ DareU</td>
                <td>850.000 VNĐ</td>
                <td>25</td>
            </tr>
            <tr>
                <td>Tai nghe Sony WH-1000XM4</td>
                <td>6.200.000 VNĐ</td>
                <td>15</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
