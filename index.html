<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành CSS grid-gap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Thực hành thuộc tính viết tắt grid-gap</h1>

    <!-- Ví dụ 1: 1 giá trị (khoảng cách hàng và cột bằng nhau) -->
    <section>
        <h2>1. Một giá trị duy nhất (grid-gap: 15px)</h2>
        <div class="grid-container gap-single">
            <div class="grid-item">1</div>
            <div class="grid-item">2</div>
            <div class="grid-item">3</div>
            <div class="grid-item">4</div>
            <div class="grid-item">5</div>
            <div class="grid-item">6</div>
        </div>
    </section>

    <!-- Ví dụ 2: 2 giá trị (hàng 30px, cột 10px) -->
    <section>
        <h2>2. Hai giá trị riêng biệt (grid-gap: 30px 10px - Hàng 30px, Cột 10px)</h2>
        <div class="grid-container gap-double">
            <div class="grid-item item-orange">A</div>
            <div class="grid-item item-orange">B</div>
            <div class="grid-item item-orange">C</div>
            <div class="grid-item item-orange">D</div>
            <div class="grid-item item-orange">E</div>
            <div class="grid-item item-orange">F</div>
        </div>
    </section>

</body>
</html>
