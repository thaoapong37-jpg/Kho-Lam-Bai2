<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Đăng Ký Tài Khoản</title>
    <!-- Nhúng thư viện Bootstrap 5.3.0 CSS từ CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <!-- Khung thẻ Card chứa Form đăng ký -->
                <div class="card border-0 shadow-sm p-4 p-md-5 rounded-4">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-primary">Tạo Tài Khoản</h2>
                        <p class="text-muted small">Vui lòng điền đầy đủ các thông tin bên dưới để đăng ký</p>
                    </div>

                    <form action="#" method="POST">
                        <!-- 1. Họ và tên -->
                        <div class="mb-3">
                            <label for="fullname" class="form-label fw-semibold">Họ và tên</label>
                            <input type="text" class="form-control" id="fullname" placeholder="Ví dụ: Nguyễn Văn A" required>
                        </div>

                        <!-- 2. Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Địa chỉ Email</label>
                            <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                            <div class="form-text text-muted">Chúng tôi cam kết không chia sẻ email của bạn cho bên thứ ba.</div>
                        </div>

                        <!-- 3. Mật khẩu & Xác nhận mật khẩu (chia 2 cột trên desktop) -->
                        <div class="row g-3 mb-3">
                            <div class="col-sm-6">
                                <label for="password" class="form-label fw-semibold">Mật khẩu</label>
                                <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                            </div>
                            <div class="col-sm-6">
                                <label for="confirmPassword" class="form-label fw-semibold">Xác nhận mật khẩu</label>
                                <input type="password" class="form-control" id="confirmPassword" placeholder="••••••••" required>
                            </div>
                        </div>

                        <!-- 4. Giới tính (Radio button) -->
                        <div class="mb-3">
                            <label class="form-label d-block fw-semibold">Giới tính</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="genderMale" value="male" checked>
                                <label class="form-check-label" for="genderMale">Nam</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="female">
                                <label class="form-check-label" for="genderFemale">Nữ</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="genderOther" value="other">
                                <label class="form-check-label" for="genderOther">Khác</label>
                            </div>
                        </div>

                        <!-- 5. Sở thích (Checkbox) -->
                        <div class="mb-3">
                            <label class="form-label d-block fw-semibold">Sở thích</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="hobbyReading" value="reading">
                                <label class="form-check-label" for="hobbyReading">Đọc sách</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="hobbySports" value="sports">
                                <label class="form-check-label" for="hobbySports">Thể thao</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="hobbyTravel" value="travel">
                                <label class="form-check-label" for="hobbyTravel">Du lịch</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="hobbyCoding" value="coding">
                                <label class="form-check-label" for="hobbyCoding">Lập trình</label>
                            </div>
                        </div>

                        <!-- 6. Quốc gia (Dropdown Select) -->
                        <div class="mb-4">
                            <label for="country" class="form-label fw-semibold">Quốc gia</label>
                            <select class="form-select" id="country" required>
                                <option value="" selected disabled>-- Chọn quốc gia --</option>
                                <option value="vn">Việt Nam</option>
                                <option value="us">Hoa Kỳ</option>
                                <option value="jp">Nhật Bản</option>
                                <option value="kr">Hàn Quốc</option>
                                <option value="other">Khác</option>
                            </select>
                        </div>

                        <!-- 7. Nút Submit -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg fw-semibold shadow-sm">Đăng Ký Ngay</button>
                        </div>
                    </form>

                    <div class="text-center mt-4">
                        <p class="text-muted small mb-0">Đã có tài khoản? <a href="#" class="text-primary text-decoration-none fw-semibold">Đăng nhập</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Nhúng Bootstrap JavaScript Bundle từ CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
