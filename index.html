<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Sử dụng thẻ hình ảnh trong HTML</title>
</head>
<body>
    <h1>Hình ảnh yêu thích của tôi</h1>

    <!-- Thẻ hiển thị hình ảnh có thuộc tính src và alt mô tả ảnh -->
    <img 
        src="https://images.unsplash.com/photo-1506744038136-46273834b3fb" 
        alt="Phong cảnh thiên nhiên núi non và hồ nước tuyệt đẹp" 
        width="600"
    >

    <p>Bức ảnh phong cảnh thiên nhiên tuyệt đẹp vào buổi hoàng hôn.</p>
</body>
</html>
