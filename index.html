<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành Mô hình hộp (CSS Box Model)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 20px;
        }

        /* Minh họa CSS Box Model: Tổng chiều rộng = 200 + 70 + 40 + 50 = 360px */
        div {
            margin: 25px;
            padding: 35px;
            width: 200px;
            background-color: lightseagreen;
            border: 20px dashed indianred;
            color: #ffffff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div>
        Content demo box<br/>
    </div>

</body>
</html>
