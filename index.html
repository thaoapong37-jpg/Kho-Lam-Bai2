<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bố cục với display</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Tiêu đề trang -->
    <h1>Bố cục trang web với display</h1>

    <!-- Thanh điều hướng dùng inline-block -->
    <nav>
        <a href="#">Trang chủ</a>
        <a href="#">Giới thiệu</a>
        <a href="#">Dịch vụ</a>
        <a href="#">Liên hệ</a>
    </nav>

    <!-- Khối nội dung 3 cột dùng display: inline-block -->
    <section>
        <div class="box">
            <h3>Cột 1</h3>
            <p>Nội dung giới thiệu dịch vụ cơ bản.</p>
        </div>
        <div class="box">
            <h3>Cột 2</h3>
            <p>Nội dung về quy trình và tính năng chính.</p>
        </div>
        <div class="box">
            <h3>Cột 3</h3>
            <p>Thông tin hỗ trợ và chính sách khách hàng.</p>
        </div>
    </section>

    <!-- Chân trang -->
    <footer>
        <p>Bản quyền &copy; 2026</p>
    </footer>

</body>
</html>
