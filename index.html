<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sử dụng bộ chọn CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-container">
        <!-- Element h1 -->
        <h1>Trang web của tôi</h1>

        <!-- Thẻ p có gắn ID selector -->
        <p id="my-bio">Xin chào! Tôi là một học viên lập trình web, đam mê công nghệ và đang thực hành thành thạo HTML/CSS.</p>

        <!-- Tiêu đề phụ dùng để minh họa Grouping Selector -->
        <h2>Sở thích của tôi</h2>

        <!-- Danh sách ul có gắn Class selector -->
        <ul class="hobby-list">
            <li class="hobby-item">Đọc sách công nghệ và phát triển bản thân</li>
            <li class="hobby-item">Chơi thể thao và rèn luyện sức khỏe</li>
            <li class="hobby-item">Khám phá và trải nghiệm du lịch</li>
        </ul>

        <br>
        <!-- Nút bấm có gắn ID và hiệu ứng Pseudo-class :hover -->
        <button id="btn-submit" type="button">Nhấn vào đây</button>
    </div>

</body>
</html>
