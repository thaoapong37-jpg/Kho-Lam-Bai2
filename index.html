<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bố cục bằng Float</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="left-column">
            <h2>Cột bên trái chứa nội dung chính</h2>
            <p>Khu vực này chiếm 60% độ rộng của khung chứa và được căn lề trôi sang trái bằng thuộc tính <code>float: left</code>.</p>
        </div>
        <div class="right-column">
            <h2>Sidebar</h2>
            <p>Khu vực này chiếm 38% độ rộng và trôi sang phải với <code>float: right</code>.</p>
        </div>
    </div>

</body>
</html>
